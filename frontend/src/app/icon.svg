<!--
  Favicon. Next serves this at /icon.svg and emits the <link rel="icon"> for it,
  which is also what stops the browser from falling back to a 404 on /favicon.ico.

  The glyph is the idea of the site in four bars: three ordinary days at baseline
  height in muted blue, and one that runs off the top in the accent colour. Colours
  are the literal values of --color-ink-950, --color-accent-dim and
  --color-accent-bright from globals.css; an SVG cannot read CSS custom properties
  from the page, so they are duplicated here and should be changed together.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#060912" />
  <g fill="#2d5f8f">
    <rect x="6" y="18" width="4" height="8" rx="1.2" />
    <rect x="12" y="20" width="4" height="6" rx="1.2" />
    <rect x="24" y="19" width="4" height="7" rx="1.2" />
  </g>
  <rect x="18" y="6" width="4" height="20" rx="1.2" fill="#a3d4fb" />
</svg>
