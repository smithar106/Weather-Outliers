[project]
name = "weather-outliers-backend"
version = "0.1.0"
description = "Daily statistical weather anomaly detection, ranking, and grounded AI explanation pipeline"
requires-python = ">=3.11"
license = { text = "MIT" }

# Deliberately lean. No numpy/pandas: the statistics are hand-implemented over
# the standard library, which keeps the container small and makes the
# methodology auditable line by line.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "SQLAlchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "httpx>=0.27,<1.0",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    # Shuffles test order every run. Listed as a dependency rather than left to
    # whoever happens to have it installed, because order-dependent tests are
    # exactly the kind that pass locally and fail in CI.
    "pytest-randomly>=3.15,<4.0",
    "ruff>=0.8,<1.0",
]

# Telemetry and the evaluation harness's experiment log. `mlflow-skinny`, not
# `mlflow`: the full distribution pulls in pandas, numpy, scipy, Flask and
# Alembic's own pinned range, and this backend deliberately has none of those
# (see the note above the runtime dependencies). Skinny carries the tracking
# client, the tracing SDK and the fluent API, which is everything this project
# calls. It is an extra rather than a runtime dependency because the application
# does not need MLflow to run: `app.observability.tracing` degrades to no-ops when
# it is absent, and every test of that path runs without it installed. The deployed
# image does install the extra, so the scheduled workers can reach the private
# tracking server; tracing still stays off until MLFLOW_TRACING_ENABLED says
# otherwise.
tracing = [
    "mlflow-skinny>=2.19,<4.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "network: test requires outbound network access to a live weather provider",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is the documented idiom
    "RUF001", # ambiguous unicode: city names legitimately contain accents
    "RUF002", # and prose in docstrings legitimately uses en dashes
    "RUF003",
    "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"alembic/*" = ["E501", "I001"]

[tool.coverage.run]
source = ["app"]
omit = ["app/pipeline/__main__.py"]
