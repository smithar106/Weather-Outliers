; Alembic configuration.
;
; The database URL is deliberately absent. It is read from the DATABASE_URL
; environment variable inside alembic/env.py, which keeps the production
; connection string out of source control and lets Railway inject
; ${{Postgres.DATABASE_URL}} without a config file edit.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
timezone = UTC

; Newly generated revisions are formatted in place, so a migration never fails
; the lint job it was generated by. `exec` rather than `console_scripts` because
; ruff is commonly installed as a standalone tool without the entry-point metadata.
[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
